server {
    listen 8080;
    server_name _;
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;

    # Keep existing links to the previous institutional website usable.
    location ~ ^/rpc-dashboard/?$ { return 301 /demo/; }
    location ~ ^/automacao/?$ { return 301 /servicos/automacao/; }
    location ~ ^/manutencao/?$ { return 301 /servicos/manutencao/; }
    location ~ ^/projetos-eletricos/?$ { return 301 /servicos/engenharia-eletrica/; }
    location ~ ^/retrofit/?$ { return 301 /servicos/retrofit/; }
    location ~ ^/sistemas/?$ { return 301 /servicos/sistemas/; }
    location ~ ^/treinamentos/?$ { return 301 /servicos/treinamentos/; }
    location ~ ^/roi-calculator/?$ { return 301 /servicos/sistemas/; }
    location ~ ^/trabalhos/([a-z0-9-]+)/?$ { return 301 /projetos/$1/; }

    # Revalidate pages and code; cache unchanged media for one week.
    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }
    location ~* \.(css|js|json|html|xml|txt)$ {
        expires -1;
        try_files $uri =404;
    }
    location ~* \.(png|jpe?g|webp|svg|ttf|woff2?)$ {
        expires 7d;
        try_files $uri =404;
    }
    location ~ /\. { deny all; }
}
